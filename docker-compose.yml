# Docker Compose for local development tools
# SonarQube for code quality analysis

version: '3.8'

services:
  sonarqube:
    image: sonarqube:community
    container_name: planninggame-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: planninggame-bridge
    ports:
      - "${BRIDGE_PORT:-3100}:3100"
    environment:
      - BRIDGE_PORT=3100
      - GOOGLE_APPLICATION_CREDENTIALS=/config/serviceAccountKey.json
      - DATABASE_URL=${DATABASE_URL}
      - BRIDGE_API_KEY=${BRIDGE_API_KEY}
      - KJ_HOME=/kj-home
    volumes:
      - ${KJ_HOME:-~/.karajan}:/kj-home:ro
      - ${SERVICE_ACCOUNT_KEY_PATH:-./serviceAccountKey.json}:/config/serviceAccountKey.json:ro
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
